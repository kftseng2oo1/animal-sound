name: 下載動物叫聲

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_sounds.py
      - .github/workflows/fetch-sounds.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 從 Freesound 下載 CC0 叫聲
        env:
          FS_TOKEN: ${{ secrets.FREESOUND_TOKEN }}
        run: python scripts/fetch_sounds.py
      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add sounds
          git diff --cached --quiet && echo "沒有變動" && exit 0
          git commit -m "下載動物叫聲音檔（Freesound CC0）"
          git push
